[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-morse-code"
version = "0.2.1"
description = "Encodes text to Morse code, played as generated audible beeps. Fully offline, nothing recorded."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "emkay-voice"}]
maintainers = [{name = "Andreas Lorensen"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "skill", "voice", "assistant", "morse", "code", "novelty", "ham", "radio", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ovos-workshop>=0.0.15,<10.0.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-skill-morse-code"
Issues = "https://github.com/emkay-voice/ovos-skill-morse-code/issues"
Emkay = "https://github.com/emkay-voice/emkay"
Icon = "https://raw.githubusercontent.com/emkay-voice/ovos-skill-morse-code/main/icon.png"

[project.entry-points."opm.skill"]
"ovos-skill-morse-code.emkay-voice" = "ovos_skill_morse_code:MorseCode"

[tool.setuptools]
packages = ["ovos_skill_morse_code"]

[tool.setuptools.package-dir]
ovos_skill_morse_code = ""

[tool.setuptools.package-data]
ovos_skill_morse_code = ["locale/**/*", "*.png"]
